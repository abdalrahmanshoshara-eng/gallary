components:
  schemas:
    ActivationRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    AddToCartRequest:
      type: object
      properties:
        listing:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
      required:
      - listing
    AdminArtist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: الاسم
          maxLength: 200
        slug:
          oneOf:
          - type: string
            maxLength: 220
            pattern: ^[-\w]+$
          - type: string
            maxLength: 0
        biography:
          type: string
          title: النبذة
        city:
          type: string
          title: المدينة
          maxLength: 100
        birth_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: سنة الميلاد
        status:
          $ref: '#/components/schemas/ArtistStatusEnum'
        is_featured:
          type: boolean
          title: مميّز
        contact_phone:
          type: string
          title: هاتف التواصل
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        internal_notes:
          type: string
          title: ملاحظات داخلية
        photo:
          allOf:
          - $ref: '#/components/schemas/AdminImage'
          readOnly: true
          nullable: true
        artwork_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - artwork_count
      - created_at
      - id
      - name
      - photo
      - updated_at
    AdminArtistRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: الاسم
          maxLength: 200
        slug:
          oneOf:
          - type: string
            maxLength: 220
            pattern: ^[-\w]+$
          - type: string
            maxLength: 0
        biography:
          type: string
          title: النبذة
        city:
          type: string
          title: المدينة
          maxLength: 100
        birth_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: سنة الميلاد
        status:
          $ref: '#/components/schemas/ArtistStatusEnum'
        is_featured:
          type: boolean
          title: مميّز
        contact_phone:
          type: string
          title: هاتف التواصل
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        internal_notes:
          type: string
          title: ملاحظات داخلية
      required:
      - name
    AdminArtwork:
      type: object
      description: Read + write. Relations are written by id (category, terms) or
        public id (artists).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: العنوان
          maxLength: 250
        slug:
          oneOf:
          - type: string
            maxLength: 270
            pattern: ^[-\w]+$
          - type: string
            maxLength: 0
        description:
          type: string
          title: الوصف
        category:
          type: integer
        artist:
          type: string
          format: uuid
          nullable: true
        creator_name_override:
          type: string
          title: اسم المُبدع (إن لم يكن الفنان مسجلاً)
          maxLength: 200
        executor:
          type: string
          format: uuid
          nullable: true
        owner_name:
          type: string
          title: المالك / صاحب حق البيع
          maxLength: 200
        owner_user_phone:
          type: string
          readOnly: true
          nullable: true
        rights_holder:
          type: string
          title: صاحب الحقوق
          maxLength: 200
        materials:
          type: array
          items:
            type: integer
        techniques:
          type: array
          items:
            type: integer
        tags:
          type: array
          items:
            type: integer
        height_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          nullable: true
        width_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          nullable: true
        depth_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          nullable: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
