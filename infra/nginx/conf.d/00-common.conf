# Shared http-level configuration (ARCHITECTURE §2–3): one origin, path-based routing.

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

upstream realtime_upstream {
    server realtime:8001;
}

# WebSocket upgrade support.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Keep a sane incoming X-Request-ID, otherwise generate one; propagated to every service.
map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._-]{8,128}$" $http_x_request_id;
    default                   $request_id;
}

# Rate limits (per client IP). Business throttling also exists in DRF (Redis-backed).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ws_conn_zone:10m;
limit_req_status 429;
limit_conn_status 429;

log_format json_combined escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

access_log /dev/stdout json_combined;
server_tokens off;
client_max_body_size 20m;
