# Path-based routing shared by the dev and prod servers. Requires $forwarded_proto.

add_header X-Request-ID $req_id always;

# --- Django REST API -------------------------------------------------------------
location /api/v1/auth/ {
    limit_req zone=auth_zone burst=5 nodelay;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://api_upstream;
}

location /api/ {
    limit_req zone=api_zone burst=60 nodelay;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://api_upstream;
}

# Internal Django admin (helper tool only) and its static files.
location /internal-admin/ {
    limit_req zone=auth_zone burst=20 nodelay;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://api_upstream;
}

location /static/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://api_upstream;
}

# --- WebSockets (Django Channels) ------------------------------------------------
location /ws/ {
    limit_conn ws_conn_zone 20;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Client heartbeat is 25s; idle connections without pings are closed after 75s.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_pass http://realtime_upstream;
}

# --- Internal probes are not public ----------------------------------------------
location = /healthz {
    return 404;
}

# --- Next.js -----------------------------------------------------------------------
location / {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://web_upstream;
}
