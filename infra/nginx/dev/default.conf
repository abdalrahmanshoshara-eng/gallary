# Local development: plain HTTP on http://localhost:8080.
server {
    listen 80 default_server;
    server_name _;

    set $forwarded_proto $scheme;

    # Next.js dev server hot-reload socket. The dev client needs it to load and update
    # the page; without it the app does not hydrate. Development only.
    location /_next/hmr {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://web_upstream;
    }

    location /_next/webpack-hmr {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://web_upstream;
    }

    include /etc/nginx/snippets/routes.conf;
}
