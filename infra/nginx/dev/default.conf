# Local development: plain HTTP on http://localhost:8080.

upstream storage_upstream {
    server storage:8333;
}

server {
    listen 80 default_server;
    server_name _;

    set $forwarded_proto $scheme;

    # Next.js dev server hot-reload socket. The dev client needs it to load and update
    # the page; without it the app does not hydrate. Development only.
    location /_next/hmr {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://web_upstream;
    }

    location /_next/webpack-hmr {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://web_upstream;
    }

    # Public image variants from SeaweedFS (production serves them from a CDN instead).
    # Read-only, no cookies or credentials forwarded; the bucket itself forbids listing.
    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host storage:8333;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://storage_upstream/damascene-public/;
    }

    include /etc/nginx/snippets/routes.conf;
}
